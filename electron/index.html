<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Téléchargeur Pro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">⬇</span>
        <span class="title">Téléchargeur Pro</span>
      </div>
      <div class="actions">
        <button id="openFolderBtn" class="btn" title="Ouvrir le dossier de téléchargements">📁</button>
      </div>
    </header>

    <section class="urlbar">
      <input id="urlInput" type="text" placeholder="Coller l'URL du fichier ou de la vidéo" autocomplete="off" />
      <button id="addBtn" class="btn primary">Ajouter</button>
    </section>

    <section class="tasks">
      <div class="tasks-header">
        <span class="col-name">Nom</span>
        <span class="col-progress">Progression</span>
        <span class="col-size">Taille</span>
        <span class="col-speed">Vitesse</span>
        <span class="col-actions">Actions</span>
      </div>
      <div id="taskList" class="task-list"></div>
      <div id="emptyState" class="empty">Aucun téléchargement</div>
    </section>

    <footer class="statusbar">
      <span id="statusText">Prêt</span>
      <span id="counters">0 tâches</span>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
